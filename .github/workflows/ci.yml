name: CI
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
jobs:
  ci:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup WSL
        uses: Particular/setup-wsl-action@v1.1.0
      - name: Run
        uses: ./
        with:
          connection-string-name: IBMMQ_CONNECTION_STRING
      - name: Verify
        shell: pwsh
        run: |
          $connstr = $Env:IBMMQ_CONNECTION_STRING
          Write-Host "Connection String: $connstr"

          if (-not $connstr) {
            throw "Environment variable 'IBMMQ_CONNECTION_STRING' not set."
          }

          if ($connstr -notmatch '^mq://admin:.+@\S+:1414/QM1\?channel=DEV\.ADMIN\.SVRCONN&topicprefix=DEV$') {
            throw "Connection string does not match expected format."
          }

          # Verify the queue manager is running via the dspmq shim
          $output = dspmq
          Write-Host "dspmq output: $output"

          if ($LASTEXITCODE -ne 0) {
            throw "dspmq failed with exit code $LASTEXITCODE — IBM MQ is not running."
          }

          if ($output -notmatch 'Running') {
            throw "Queue manager is not running. dspmq output: $output"
          }

          Write-Host "Queue manager is running."

          # Test IBM MQ is functional: create a queue, verify it, delete it, verify it's gone.
          # We write MQSC commands to a file, docker cp it into the container, and run
          # runmqsc with input from the file — this avoids stdin piping issues through
          # the WSL interop layer on Windows (.cmd -> wsl.exe -> docker exec -i chain
          # doesn't reliably forward piped stdin).
          Import-Module $Env:WSL_TOOLS_MODULE_PATH -Force

          $containerName = "ibmmq"
          $containerScriptPath = "/tmp/test-queue.mqsc"

          function Run-Mqsc {
            param([string]$Commands)
            $tempFile = Join-Path $Env:RUNNER_TEMP "test-queue.mqsc"
            Set-Content -Path $tempFile -Value $Commands -Encoding ASCII -NoNewline

            if ($Env:WSL_DISTRIBUTION) {
              # Windows: Docker is in WSL. Translate the host path for docker cp.
              $wslTempFile = ConvertTo-WslPath -WindowsPath $tempFile
              Invoke-Wsl -CheckExitCode -Command "docker cp $wslTempFile ${containerName}:${containerScriptPath}"
              $result = Invoke-Wsl -Command "docker exec $containerName runmqsc QM1 < $containerScriptPath"
            } else {
              # Linux: Docker is on the host.
              docker cp $tempFile "${containerName}:${containerScriptPath}"
              $result = docker exec $containerName bash -c "runmqsc QM1 < $containerScriptPath"
            }
            return $result
          }

          # Create and verify
          Write-Host ""
          Write-Host "Creating test queue TESTQ..."
          $createOutput = Run-Mqsc -Commands "DEFINE QLOCAL(TESTQ)`nDISPLAY QLOCAL(TESTQ)`nend"
          Write-Host $createOutput

          if ($createOutput -notmatch 'AMQ8009I') {
            throw "Failed to create or display TESTQ. runmqsc output: $createOutput"
          }
          Write-Host "TESTQ created and verified."

          # Delete and verify gone
          Write-Host ""
          Write-Host "Deleting test queue TESTQ..."
          $deleteOutput = Run-Mqsc -Commands "DELETE QLOCAL(TESTQ)`nDISPLAY QLOCAL(TESTQ)`nend"
          Write-Host $deleteOutput

          if ($deleteOutput -notmatch 'AMQ8147E') {
            throw "TESTQ was not deleted or still exists. runmqsc output: $deleteOutput"
          }
          Write-Host "TESTQ deleted and verified gone."

          Write-Host ""
          Write-Host "IBM MQ is fully functional — queue create/delete verified."