name: CI
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
jobs:
  ci:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup WSL
        uses: Particular/setup-wsl-action@v1.1.0
      - name: Run
        uses: ./
        with:
          connection-string-name: IBMMQ_CONNECTION_STRING
      - name: Verify
        shell: pwsh
        run: |
          $connstr = $Env:IBMMQ_CONNECTION_STRING
          Write-Host "Connection String: $connstr"

          if (-not $connstr) {
            throw "Environment variable 'IBMMQ_CONNECTION_STRING' not set."
          }

          if ($connstr -notmatch '^mq://admin:.+@\S+:1414/QM1\?channel=DEV\.ADMIN\.SVRCONN&topicprefix=DEV$') {
            throw "Connection string does not match expected format."
          }

          # Verify the queue manager is running via the dspmq shim
          $output = dspmq
          Write-Host "dspmq output: $output"

          if ($LASTEXITCODE -ne 0) {
            throw "dspmq failed with exit code $LASTEXITCODE — IBM MQ is not running."
          }

          if ($output -notmatch 'Running') {
            throw "Queue manager is not running. dspmq output: $output"
          }

          Write-Host "Queue manager is running."

          # Test IBM MQ is functional: create a queue, verify it, delete it, verify it's gone.
          # The runmqsc shim handles platform differences (bash on Linux, .ps1 on Windows).
          # Piped stdin flows through to docker exec -i ibmmq runmqsc on both platforms.
          Write-Host ""
          Write-Host "Creating test queue TESTQ..."
          $createOutput = "DEFINE QLOCAL(TESTQ)`nDISPLAY QLOCAL(TESTQ)`nend" | runmqsc QM1
          Write-Host $createOutput

          if ($createOutput -notmatch 'AMQ8009I') {
            throw "Failed to create or display TESTQ. runmqsc output: $createOutput"
          }
          Write-Host "TESTQ created and verified."

          Write-Host ""
          Write-Host "Deleting test queue TESTQ..."
          $deleteOutput = "DELETE QLOCAL(TESTQ)`nDISPLAY QLOCAL(TESTQ)`nend" | runmqsc QM1
          Write-Host $deleteOutput

          if ($deleteOutput -notmatch 'AMQ8147E') {
            throw "TESTQ was not deleted or still exists. runmqsc output: $deleteOutput"
          }
          Write-Host "TESTQ deleted and verified gone."

          Write-Host ""
          Write-Host "IBM MQ is fully functional — queue create/delete verified."